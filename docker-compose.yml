services:
    #MongoDB Services
    mongo_db:
        image: mongo:latest
        restart: always
        volumes:
            - mongo_db:/data/db

    #Node Services
    app:
        build: .
        ports:
            - 3001:3001
        environment:
            - PORT=3001
            - MONGODB_URI=mongodb://mongo_db:27017/
            - DB_NAME=MyDataBase
            - NAME=App Manager
        depends_on: 
            - mongo_db

volumes: 
    mongo_db: {}
