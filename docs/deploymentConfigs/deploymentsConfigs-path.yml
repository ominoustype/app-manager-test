get:
    operationId: searchDeploymentsConfigs
    tags:
        - DeploymentsConfigsCtrl
    summary:
        List the deploymentsConfigs that match the search criteria
    description:
        This rest services return a list of deploymentConfigs that match the search
        criteria (if not provided, then 50 deploymentConfigs are returned)
    parameters:
        - $ref: ../shared/parameters/page-parameter.yml#/PageParameter
        - $ref: ../shared/parameters/page-size-parameter.yml#/PageSizeParemeter
        - $ref: ./parameters/deploymentConfigs-search-parameter.yml#/DeploymentConfigsSearchParameter
    responses:
        200:
            description: A list of the deploymentConfigs that match the search params.
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            results:
                                type: array
                                items:
                                    $ref: ./models/deploymentConfigs.yml#/DeploymentConfigs
        401:
            $ref: ../shared/responses/responses.yml#/Unauthorized
        403:
            $ref: ../shared/responses/responses.yml#/Forbidden

post:
    operationId: createDeploymentConfigs
    tags:
        - DeploymentsConfigsCtrl
    summary: Create a deploymentConfigs based on the given information
    description:
        This rest services allow to create a deploymentConfigs based on the
        given information
    requestBody:
        content:
            application/json:
                schema:
                    $ref: deploymentConfigs-post-body.yml#/DeploymentConfigsPostBody
    responses:
        201:
            $ref: ../shared/responses/responses.yml#/Created
        401:
            $ref: ../shared/responses/responses.yml#/Unauthorized
        403:
            $ref: ../shared/responses/responses.yml#/Forbidden