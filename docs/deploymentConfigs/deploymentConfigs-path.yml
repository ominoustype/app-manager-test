get:
    operationId: findDeploymentConfigs
    tags:
        - DeploymentConfigsCtrl
    summary: Find a deploymentConfigs that match the id search criteria
    description:
        This rest services return a deploymentConfigs that match the id search criteria
    parameters:
        - $ref: ../shared/parameters/id-path-parameter.yml#/IdPathParameter
    responses:
        200:
            description: The deploymentConfigs that match the given id.
            content:
                application/json:
                    schema:
                        $ref: models/deploymentConfigs.yml#/DeploymentConfigs
                    example:
                        $ref: models/deploymentConfigs.yml#/DeploymentConfigs/example
        401:
            $ref: ../shared/responses/responses.yml#/Unauthorized
        403:
            $ref: ../shared/responses/responses.yml#/Forbidden
        404:
            $ref: ../shared/responses/responses.yml#/NotFound

delete:
    operationId: deleteDeploymentConfigs
    tags:
        - DeploymentConfigsCtrl
    summary: Delete an existent deploymentConfigs
    description: This rest service deletes an existent deploymentConfigs
    parameters:
        - $ref: ../shared/parameters/id-path-parameter.yml#/IdPathParameter
    responses:
        204:
            $ref: ../shared/responses/responses.yml#/NoContent
        401:
            $ref: ../shared/responses/responses.yml#/Unauthorized
        403:
            $ref: ../shared/responses/responses.yml#/Forbidden
        404:
            $ref: ../shared/responses/responses.yml#/NotFound

put:
    operationId: updateDeploymentConfigs
    tags:
        - DeploymentConfigsCtrl
    summary: Update an existing deploymentConfigs based on the given information
    description:
        This rest services allow to update an existing deploymentConfigs based on
        the given information
    parameters:
        - $ref: ../shared/parameters/id-path-parameter.yml#/IdPathParameter
    requestBody:
        content:
            application/json:
                schema:
                    $ref: deploymentConfigs-put-body.yml#/DeploymentConfigsPutBody
    responses:
        204:
            $ref: ../shared/responses/responses.yml#/NoContent
        401:
            $ref: ../shared/responses/responses.yml#/Unauthorized
        403:
            $ref: ../shared/responses/responses.yml#/Forbidden
        404:
            $ref: ../shared/responses/responses.yml#/NotFound