openapi: 3.0.3

info:
    title: AppManager Backend
    description: |
        Full Api Documentation for the AppManager Backend
    version: 0.0.0

servers:
  - url: https://localhost:3000/
    description: Local server

paths:
  /documents:
    $ref: ./documents/document-path.yml
  /documents/{id}:
    $ref: ./documents/documents-path.yml

  /deploymentConfigs:
    $ref: ./deploymentConfigs/deploymentConfigs-path.yml
  /deploymentConfigs/{id}:
    $ref: ./deploymentConfigs/deploymentsConfigs-path.yml


components:
    securitySchemes:
        ApiKeyAuth: # arbitrary name for the security scheme
            type: apiKey
            in: header # can be "header", "query" or "cookie"
            name: x-api-key # name of the header, query parameter or cookie
    schemas:
        Document:
            $ref: ./documents/models/document.yml#/Document
        DeploymentConfigs:
            $ref: ./deploymentConfigs/models/deploymentConfigs.yml#/DeploymentConfigs