get:
    operationId: searchEnvironments
    tags:
        - EnvironmentsCtrl
    summary:
        List the environments that match the search criteria
    description:
        This rest services return a list of environments that match the search
        criteria (if not provided, then 50 environments are returned)
    parameters:
        - $ref: ../shared/parameters/page-parameter.yml#/PageParameter
        - $ref: ../shared/parameters/page-size-parameter.yml#/PageSizeParemeter
        - $ref: ./parameters/environment-search-parameter.yml#/EnvironmentSearchParameter
    responses:
        200:
            description: A list of the environments that match the search params.
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            results:
                                type: array
                                items:
                                    $ref: ./models/environment.yml#/Environment
        401:
            $ref: ../shared/responses/responses.yml#/Unauthorized
        403:
            $ref: ../shared/responses/responses.yml#/Forbidden

post:
    operationId: createEnvironment
    tags:
        - EnvironmentsCtrl
    summary: Create a environment based on the given information
    description:
        This rest services allow to create a environment based on the
        given information
    requestBody:
        content:
            application/json:
                schema:
                    $ref: environment-post-body.yml#/EnvironmentPostBody
    responses:
        201:
            $ref: ../shared/responses/responses.yml#/Created
        401:
            $ref: ../shared/responses/responses.yml#/Unauthorized
        403:
            $ref: ../shared/responses/responses.yml#/Forbidden