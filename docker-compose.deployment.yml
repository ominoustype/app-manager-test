version: '3.8'
services:
    app:
        build:
            context: .
            dockerfile: Dockerfile.onpremise
        ports:
            - "3000:3000"
        depends_on:
            - mongodb
        environment:
            - MONGO_URL=mongodb://mongo:27017/mydatabase
    mongodb:
        image: mongo:latest
        ports:
            - 27017:27017
        volumes:
            - ./.data/mongo:/data/db
volumes:
    mongodata: