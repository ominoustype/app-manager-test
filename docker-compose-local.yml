services:
    #MongoDB Services
    mongo_local_db:
        image: mongo:latest
        container_name: mongo_local_db
        restart: always
        volumes:
            - mongo_local_db:/data/db
        ports:
            - 27018:27017

    #Redis Cache Services
    redis_local_cache:
        image:  redis:latest
        restart: always
        volumes:
            - redis_local_cache:/data/cache
        ports:
        - 6379:6379
        command: redis-server --save 20 1 --loglevel warning

volumes:
    mongo_local_db: {}
    redis_local_cache: {}

