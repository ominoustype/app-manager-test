services:
    #MongoDB Services
    mongo_db:
        image: mongo:latest
        restart: always
        volumes:
            - mongo_db:/data/db
        ports:
            - 27017:27017

    #Node Services
    app:
        build: .
        ports:
            - 3000:3000
        environment:
            - PORT=3000
            - MONGODB_URI=mongodb://mongo_db:27017/
            - DEPLOYMENT_MESSAGE=Dockerized for on-premise
        depends_on: 
            - mongo_db

volumes: 
    mongo_db: {}
