services:
    #MongoDB Services
    mongo_db:
        image: mongo:latest
        container_name: mongo_db
        restart: always
        volumes:
            - mongo_db:/data/db
        ports:
            - 27017:27017
        command: mongod --quiet --logpath /dev/null

    #Node Express Services
    express:
        build: .
        container_name: express
        ports:
            - 5000:3000
        environment:
            - PORT=5000
            - PORT_CONTAINER=3000
            - MONGODB_URI=mongodb://mongo_db:27017/
            - DEPLOYMENT_MESSAGE=Dockerized for on-premise
        depends_on: 
            - mongo_db
        # TODO healthchecks

volumes: 
    mongo_db: {}

networks:
    default:
        name: app-manager-network 
        external: false 
